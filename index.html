<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="description" content="Bản đồ và danh sách sự kiện văn hóa, nghệ thuật, workshop tại Hà Nội." />
  <meta name="theme-color" content="#111827" />
  <title>Hanoi Events</title>

  <style>
:root {
  --bg: #f5f5f3;
  --panel: #ffffff;
  --text: #151515;
  --muted: #6b7280;
  --border: #dfdfda;
  --accent: #111827;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  --radius: 16px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, input, select { font: inherit; }

a { color: inherit; }

.site-header {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  padding: 24px 28px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(245, 245, 243, 0.95);
}

.eyebrow {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

h1 {
  margin: 0;
  font-size: clamp(28px, 4vw, 46px);
  letter-spacing: -0.04em;
  line-height: 1;
}

.subtitle {
  margin: 10px 0 0;
  color: var(--muted);
  max-width: 720px;
}

.header-meta {
  color: var(--muted);
  font-size: 13px;
  text-align: right;
  white-space: nowrap;
  align-self: flex-end;
}

.app-shell { padding: 16px 20px 24px; }

.filters {
  display: grid;
  grid-template-columns: minmax(240px, 2fr) minmax(150px, 1fr) minmax(180px, 1fr) auto auto;
  gap: 10px;
  align-items: end;
  margin-bottom: 12px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
}

.field input, .field select {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  padding: 9px 11px;
  color: var(--text);
  outline: none;
}

.field input:focus, .field select:focus {
  border-color: #9ca3af;
  box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
}

.quick-actions { display: flex; gap: 8px; }

.button, .view-button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  min-height: 42px;
  padding: 9px 12px;
  cursor: pointer;
  font-weight: 700;
}

.button:hover, .view-button:hover { border-color: #9ca3af; }

.checkbox-field {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 2px;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}

.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 34px;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
}

#result-count { color: var(--text); }

#filter-summary::before {
  content: " · ";
}

.workspace {
  display: grid;
  grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
  gap: 12px;
  height: calc(100vh - 235px);
  min-height: 560px;
}

.event-panel, .map-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.event-panel { overflow-y: auto; }

.event-list {
  display: flex;
  flex-direction: column;
}

.event-card {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 120ms ease;
}

.event-card:hover, .event-card.is-selected { background: #f4f4f0; }

.event-card-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.event-type {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  border-radius: 999px;
  padding: 4px 8px;
  background: #efefeb;
  color: #3f3f46;
  font-size: 11px;
  font-weight: 800;
}

.map-status {
  font-size: 12px;
  color: var(--muted);
}

.event-name {
  margin: 0 0 8px;
  font-size: 17px;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.event-time, .event-venue, .event-note {
  margin: 5px 0;
  font-size: 13px;
  line-height: 1.45;
}

.event-time { font-weight: 750; }

.event-venue, .event-note { color: var(--muted); }

.event-note {
  padding-left: 10px;
  border-left: 2px solid #d4d4d0;
}

.event-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
  font-size: 12px;
  font-weight: 750;
}

.event-actions a {
  text-decoration: none;
  border-bottom: 1px solid currentColor;
}

.event-actions a[hidden] { display: none; }

.map-panel { position: relative; }

#map { width: 100%; height: 100%; }

.map-note {
  position: absolute;
  z-index: 2;
  left: 12px;
  bottom: 12px;
  padding: 7px 9px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
  font-size: 11px;
  color: var(--muted);
  pointer-events: none;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 4px;
  border-radius: 50%;
}

.dot-mapped { background: #111827; }

.empty-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--muted);
}

.empty-state h2 { color: var(--text); font-size: 18px; }

.mobile-view-switch { display: none; }

.maplibregl-popup-content {
  min-width: 240px;
  max-width: min(320px, 80vw);
  border-radius: 12px;
  padding: 14px;
  font-family: inherit;
}

.popup-title {
  margin: 0 0 8px;
  font-size: 15px;
  line-height: 1.3;
}

.popup-line {
  margin: 5px 0;
  color: #52525b;
  font-size: 12px;
  line-height: 1.4;
}

.popup-actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 750;
}

.popup-actions a { text-decoration: underline; }

@media (max-width: 1000px) {
  .filters {
    grid-template-columns: 2fr 1fr 1fr;
  }

  .quick-actions { grid-column: span 2; }
  .checkbox-field { justify-self: end; }
}

@media (max-width: 720px) {
  .site-header {
    padding: 18px 16px 14px;
    display: block;
  }

  .header-meta {
    text-align: left;
    margin-top: 10px;
  }

  .app-shell { padding: 10px; }

  .filters {
    grid-template-columns: 1fr 1fr;
  }

  .field-search { grid-column: 1 / -1; }
  .quick-actions { grid-column: auto; }
  .checkbox-field { justify-self: start; }

  .mobile-view-switch {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .view-button {
    border: 0;
    border-radius: 0;
    min-height: 34px;
    padding: 6px 10px;
    font-size: 12px;
  }

  .view-button.active {
    background: var(--accent);
    color: white;
  }

  .workspace {
    display: block;
    height: calc(100vh - 330px);
    min-height: 500px;
  }

  .event-panel, .map-panel {
    width: 100%;
    height: 100%;
  }

  .map-panel { display: none; }
  body[data-mobile-view="map"] .event-panel { display: none; }
  body[data-mobile-view="map"] .map-panel { display: block; }

  #filter-summary { display: none; }
}

@media (max-width: 480px) {
  .filters { grid-template-columns: 1fr; }
  .field-search, .quick-actions { grid-column: auto; }
  .checkbox-field { min-height: 32px; }
  .quick-actions .button { flex: 1; }
  .workspace { height: calc(100vh - 410px); }
}


.simple-map {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #e5e7eb;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.simple-map.is-dragging { cursor: grabbing; }
.simple-map-tiles, .simple-map-markers { position: absolute; inset: 0; overflow: hidden; }
.simple-map-tile {
  position: absolute;
  width: 256px;
  height: 256px;
  max-width: none;
  user-select: none;
  pointer-events: none;
  background: #eef1f4;
}








.simple-map-marker {
  position: absolute;
  width: 16px;
  height: 16px;
  transform: translate(-50%, -50%);
  border: 2px solid #fff;
  border-radius: 50%;
  background: #111827;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  cursor: pointer;
  z-index: 4;
}
.simple-map-marker:hover { width: 20px; height: 20px; }
.simple-map-controls {
  position: absolute;
  right: 12px;
  top: 12px;
  z-index: 8;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 3px 12px rgba(0,0,0,.14);
}
.simple-map-controls button {
  width: 38px;
  height: 38px;
  border: 0;
  background: #fff;
  cursor: pointer;
  font-size: 21px;
  line-height: 1;
}
.simple-map-controls button + button { border-top: 1px solid #e5e7eb; }
.simple-map-controls button:hover { background: #f3f4f6; }
.simple-map-popup {
  position: absolute;
  z-index: 9;
  width: min(300px, calc(100% - 28px));
  padding: 13px;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 8px 28px rgba(0,0,0,.22);
  transform: translate(-50%, calc(-100% - 14px));
  font-size: 12px;
}
.simple-map-popup::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -7px;
  width: 14px;
  height: 14px;
  background: #fff;
  transform: translateX(-50%) rotate(45deg);
}
.simple-map-popup h3 { margin: 0 0 7px; font-size: 15px; line-height: 1.3; }
.simple-map-popup p { margin: 5px 0; color: #52525b; line-height: 1.4; }
.simple-map-popup .popup-actions { position: relative; z-index: 1; margin-top: 9px; }
.simple-map-attribution {
  position: absolute;
  right: 6px;
  bottom: 5px;
  z-index: 6;
  padding: 2px 5px;
  border-radius: 4px;
  background: rgba(255,255,255,.88);
  color: #52525b;
  font-size: 10px;
}
.simple-map-attribution a { color: inherit; }

</style>
</head>

  <header class="site-header">
    <div>
      <p class="eyebrow">HANOI EVENTS</p>
      <h1>Sự kiện ở Hà Nội</h1>
      <p class="subtitle">Tìm theo ngày, loại sự kiện hoặc địa điểm — xem trên bản đồ và danh sách.</p>
    </div>
    <div class="header-meta" id="data-meta" aria-live="polite"></div>
  </header>

  <main class="app-shell">
    <section class="filters" aria-label="Bộ lọc sự kiện">
      <label class="field field-search">
        <span>Tìm kiếm</span>
        <input id="search-input" type="search" placeholder="Tên sự kiện, địa điểm..." autocomplete="off" />
      </label>

      <label class="field">

        <input id="date-input" type="date" />
      </label>

        <button class="button button-secondary" id="today-button" type="button">Hôm nay</button>
        <button class="button button-secondary" id="clear-button" type="button">Xóa lọc</button>
      </div>

      <label class="checkbox-field">
        <input id="hide-past" type="checkbox" checked />
        <span>Ẩn sự kiện đã kết thúc</span>
      </label>
    </section>

    <section class="status-row">
      <div>
        <strong id="result-count">0 sự kiện</strong>
        <span id="filter-summary"></span>
      </div>
      <div class="mobile-view-switch" role="group" aria-label="Chuyển chế độ hiển thị">
        <button type="button" class="view-button active" data-view="list">Danh sách</button>
        <button type="button" class="view-button" data-view="map">Bản đồ</button>

    </section>

    <section class="workspace">
      <aside class="event-panel" id="list-panel" aria-label="Danh sách sự kiện">
        <div id="event-list" class="event-list"></div>
        <div id="empty-state" class="empty-state" hidden>
          <h2>Không có sự kiện phù hợp</h2>
          <p>Thử đổi ngày, loại sự kiện hoặc từ khóa tìm kiếm.</p>
        </div>
      </aside>

      <section class="map-panel" id="map-panel" aria-label="Bản đồ sự kiện">
        <div id="map"></div>
        <div class="map-note">
          <span class="dot dot-mapped"></span>
          Marker chỉ hiển thị cho địa điểm đã có tọa độ.
        </div>
      </section>
    </section>
  </main>

  <template id="event-card-template">

  <script>

class SimpleOSMMap {
  constructor(container, options = {}) {
    this.container = typeof container === "string" ? document.getElementById(container) : container;
    this.center = options.center || [105.845, 21.028];
    this.zoom = Number.isFinite(options.zoom) ? options.zoom : 12;
    this.minZoom = 3;
    this.maxZoom = 18;
    this.tileSize = 256;
    this.events = [];
    this.onEventClick = options.onEventClick || null;
    this.popupEvent = null;
    this.drag = null;

    this.container.classList.add("simple-map");
    this.container.innerHTML = "";

    this.tileLayer = document.createElement("div");
    this.tileLayer.className = "simple-map-tiles";
    this.markerLayer = document.createElement("div");
    this.markerLayer.className = "simple-map-markers";
    this.container.append(this.tileLayer, this.markerLayer);

    const controls = document.createElement("div");
    controls.className = "simple-map-controls";
    const plus = document.createElement("button");
    plus.type = "button";
    plus.textContent = "+";
    plus.setAttribute("aria-label", "Phóng to bản đồ");
    const minus = document.createElement("button");
    minus.type = "button";
    minus.textContent = "−";
    minus.setAttribute("aria-label", "Thu nhỏ bản đồ");
    controls.append(plus, minus);
    this.container.append(controls);

    const attr = document.createElement("div");
    attr.className = "simple-map-attribution";
    attr.innerHTML = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>';
    this.container.append(attr);

    plus.addEventListener("click", (e) => { e.stopPropagation(); this.setZoom(this.zoom + 1); });
    minus.addEventListener("click", (e) => { e.stopPropagation(); this.setZoom(this.zoom - 1); });

    this.container.addEventListener("wheel", (e) => {
      e.preventDefault();
      this.setZoom(this.zoom + (e.deltaY < 0 ? 1 : -1));
    }, { passive: false });

    this.container.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".simple-map-marker, .simple-map-controls, .simple-map-popup, a")) return;
      this.drag = { x: e.clientX, y: e.clientY, centerWorld: this.lngLatToWorld(this.center[0], this.center[1], this.zoom) };
      this.container.classList.add("is-dragging");
      try { this.container.setPointerCapture(e.pointerId); } catch (_) {}
      this.closePopup();
    });

    this.container.addEventListener("pointermove", (e) => {
      if (!this.drag) return;
      const dx = e.clientX - this.drag.x;
      const dy = e.clientY - this.drag.y;
      const world = { x: this.drag.centerWorld.x - dx, y: this.drag.centerWorld.y - dy };
      this.center = this.worldToLngLat(world.x, world.y, this.zoom);
      this.render();
    });

    const endDrag = (e) => {
      if (!this.drag) return;
      this.drag = null;
      this.container.classList.remove("is-dragging");
      try { this.container.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    this.container.addEventListener("pointerup", endDrag);
    this.container.addEventListener("pointercancel", endDrag);

    if (window.ResizeObserver) {
      this.resizeObserver = new ResizeObserver(() => this.render());
      this.resizeObserver.observe(this.container);
    } else {
      window.addEventListener("resize", () => this.render());
    }
    this.render();
  }

  lngLatToWorld(lng, lat, z = this.zoom) {
    const n = Math.pow(2, z) * this.tileSize;
    const clampedLat = Math.max(-85.05112878, Math.min(85.05112878, lat));
    const sin = Math.sin(clampedLat * Math.PI / 180);
    return {
      x: (lng + 180) / 360 * n,
      y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * n
    };
  }

  worldToLngLat(x, y, z = this.zoom) {
    const n = Math.pow(2, z) * this.tileSize;
    const lng = x / n * 360 - 180;
    const a = Math.PI - 2 * Math.PI * y / n;
    const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(a) - Math.exp(-a)));
    return [lng, lat];
  }

  viewport() {
    const w = this.container.clientWidth || 800;
    const h = this.container.clientHeight || 600;
    const centerWorld = this.lngLatToWorld(this.center[0], this.center[1], this.zoom);
    return { w, h, left: centerWorld.x - w / 2, top: centerWorld.y - h / 2 };
  }

  setZoom(z) {
    const next = Math.max(this.minZoom, Math.min(this.maxZoom, Math.round(z)));
    if (next === this.zoom) return;
    this.zoom = next;
    this.render();
  }

  getZoom() { return this.zoom; }

  setEvents(events) {
    this.events = Array.isArray(events) ? events : [];
    this.renderMarkers();
  }

  focusEvent(event) {
    if (!Number.isFinite(event.longitude) || !Number.isFinite(event.latitude)) return;
    this.center = [event.longitude, event.latitude];
    this.zoom = Math.max(this.zoom, 14);
    this.popupEvent = event;
    this.render();
  }

  resize() { this.render(); }

  render() {
    this.renderTiles();
    this.renderMarkers();
    if (this.popupEvent) this.renderPopup(this.popupEvent);
  }

  renderTiles() {
    const v = this.viewport();
    const z = this.zoom;
    const count = Math.pow(2, z);
    const minX = Math.floor(v.left / this.tileSize) - 1;
    const maxX = Math.floor((v.left + v.w) / this.tileSize) + 1;
    const minY = Math.floor(v.top / this.tileSize) - 1;
    const maxY = Math.floor((v.top + v.h) / this.tileSize) + 1;

    this.tileLayer.replaceChildren();
    const frag = document.createDocumentFragment();

    for (let tx = minX; tx <= maxX; tx++) {
      for (let ty = minY; ty <= maxY; ty++) {
        if (ty < 0 || ty >= count) continue;

        const wrappedX = ((tx % count) + count) % count;
        const img = document.createElement("img");
        img.className = "simple-map-tile";
        img.alt = "";
        img.draggable = false;
        img.loading = "eager";
        img.referrerPolicy = "strict-origin-when-cross-origin";
        img.src = "https://basemaps.cartocdn.com/rastertiles/voyager/" +
          z + "/" + wrappedX + "/" + ty + ".png?key=cb1_59d5_1_43ab046c61e979e5d685707e";
        img.style.left = Math.round(tx * this.tileSize - v.left) + "px";
        img.style.top = Math.round(ty * this.tileSize - v.top) + "px";

        img.addEventListener("error", () => {
          img.style.display = "none";
        });

        frag.append(img);
      }
    }

    this.tileLayer.append(frag);
  }

  renderMarkers() {
    const v = this.viewport();
    this.markerLayer.replaceChildren();
    const frag = document.createDocumentFragment();

    for (const event of this.events) {
      if (!Number.isFinite(event.longitude) || !Number.isFinite(event.latitude)) continue;
      const world = this.lngLatToWorld(event.longitude, event.latitude, this.zoom);
      const x = world.x - v.left;
      const y = world.y - v.top;
      if (x < -30 || x > v.w + 30 || y < -30 || y > v.h + 30) continue;

      const marker = document.createElement("button");
      marker.type = "button";
      marker.className = "simple-map-marker";
      marker.style.left = x + "px";
      marker.style.top = y + "px";
      marker.title = event.name || "Sự kiện";
      marker.setAttribute("aria-label", event.name || "Sự kiện");
      marker.addEventListener("click", (e) => {
        e.stopPropagation();
        this.popupEvent = event;
        this.renderPopup(event);
        if (this.onEventClick) this.onEventClick(event);
      });
      frag.append(marker);
    }
    this.markerLayer.append(frag);
  }

  renderPopup(event) {
    this.closePopup(false);
    if (!Number.isFinite(event.longitude) || !Number.isFinite(event.latitude)) return;
    const v = this.viewport();
    const world = this.lngLatToWorld(event.longitude, event.latitude, this.zoom);
    let x = world.x - v.left;
    let y = world.y - v.top;
    x = Math.max(160, Math.min(v.w - 160, x));
    y = Math.max(130, Math.min(v.h - 20, y));

    const popup = document.createElement("div");
    popup.className = "simple-map-popup";
    popup.style.left = x + "px";
    popup.style.top = y + "px";

    const title = document.createElement("h3");
    title.textContent = event.name || "Sự kiện";
    const time = document.createElement("p");
    time.textContent = "🗓 " + (event.schedule_raw || "Chưa cập nhật thời gian");
    const venue = document.createElement("p");
    venue.textContent = "📍 " + (event.venue || "Chưa cập nhật địa điểm");
    popup.append(title, time, venue);

    const actions = document.createElement("div");
    actions.className = "popup-actions";
    if (event.url) {
      const a = document.createElement("a");
      a.href = event.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Chi tiết ↗";
      actions.append(a);
    }
    if (event.maps_url) {
      const a = document.createElement("a");
      a.href = event.maps_url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Google Maps ↗";
      actions.append(a);
    }
    popup.append(actions);
    popup.addEventListener("click", (e) => e.stopPropagation());
    this.container.append(popup);
    this.popupNode = popup;
  }

  closePopup(clearEvent = true) {
    if (this.popupNode) this.popupNode.remove();
    this.popupNode = null;
    if (clearEvent) this.popupEvent = null;
  }
}

  }
  if (params.get("type")) els.type.value = params.get("type");

  els.meta.textContent =
    `${DATA.meta.total_events} sự kiện · ${DATA.meta.mapped_events} có tọa độ · dữ liệu: ${DATA.meta.source_sheet}`;

  document.body.dataset.mobileView = "list";

  let map = null;
  let mapReady = false;
  let selectedId = null;
  let latestFiltered = [];

  function showMapError(message) {
    const mapEl = document.getElementById("map");
    if (!mapEl) return;
    mapEl.innerHTML = `
      <div style="height:100%;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#6b7280;background:#fafafa">
        <div>
          <strong style="display:block;color:#151515;margin-bottom:8px">Bản đồ chưa tải được</strong>
          <span>${message}</span>
          <div style="margin-top:8px;font-size:12px">Danh sách sự kiện bên trái vẫn hoạt động bình thường.</div>
        </div>
      </div>`;
  }

  function initMap() {
    try {
      map = new SimpleOSMMap("map", {
        center: [105.845, 21.028],
        zoom: 12,
        onEventClick: (event) => selectEvent(event, true)
      });
      mapReady = true;
      renderMap(latestFiltered);
    } catch (err) {
      console.error("Map initialization failed:", err);
      showMapError("Có lỗi khi khởi tạo bản đồ.");
    }
  }

  function localISODate(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function safeDate(iso) {
    if (!iso) return null;
    const d = new Date(`${iso}T12:00:00`);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function isWeekend(iso) {
    const d = safeDate(iso);
    if (!d) return false;
    const day = d.getDay();
    return day === 0 || day === 6;
  }

  function isOnSelectedDate(event, iso) {
    if (!iso) return true;

    if (event.recurrence === "weekends") return isWeekend(iso);

    if (event.recurrence === "monthly_unspecified") {
      return iso.slice(0, 7) === DATA.meta.data_as_of.slice(0, 7);
    }

    if (event.date_precision === "month" && event.start_date) {
      return iso.slice(0, 7) === event.start_date.slice(0, 7);
    }

    const start = event.filter_start_date || event.start_date;
    const end = event.filter_end_date || event.end_date || start;

    if (!start && !end) return false;
    if (start && end) return iso >= start && iso <= end;
    if (start) return iso >= start;
    return iso <= end;
  }

  function isPast(event, todayIso) {
    if (event.recurrence) return false;
    const end = event.end_date || event.start_date;
    if (!end) return false;
    return end < todayIso;
  }

  function normalizedText(value) {
    return (value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLocaleLowerCase("vi")
      .replace(/đ/g, "d");
  }

  function eventSortKey(event) {
    const date = event.start_date || event.filter_start_date || event.end_date || "9999-12-31";
    const time = event.start_time || "99:99";
    return `${date}T${time}-${String(event.id).padStart(4, "0")}`;
  }

  function filteredEvents() {
    const q = normalizedText(els.search.value.trim());
    const selectedDate = els.date.value;
    const selectedType = els.type.value;
    const today = localISODate();

    return DATA.events
      .filter(event => {
        if (els.hidePast.checked && !selectedDate && isPast(event, today)) return false;
        if (selectedDate && !isOnSelectedDate(event, selectedDate)) return false;
        if (selectedType && event.type_group !== selectedType) return false;

        if (q) {
          const haystack = normalizedText([
            event.name, event.venue, event.event_type, event.type_group, event.schedule_raw, event.note
          ].filter(Boolean).join(" "));
          if (!haystack.includes(q)) return false;
        }
        return true;
      })
      .sort((a, b) => eventSortKey(a).localeCompare(eventSortKey(b), "vi"));
  }

  function validHttpUrl(url) {
    if (!url) return null;
    try {
      const u = new URL(url);
      return ["http:", "https:"].includes(u.protocol) ? u.href : null;
    } catch (_) {
      return null;
    }
  }

  function render() {
    latestFiltered = filteredEvents();
    renderList(latestFiltered);
    renderMap(latestFiltered);
    renderStatus(latestFiltered);
    syncQueryParams();
  }

  function renderList(events) {
    els.list.replaceChildren();
    els.empty.hidden = events.length !== 0;

    const fragment = document.createDocumentFragment();

    for (const event of events) {
      const node = els.template.content.firstElementChild.cloneNode(true);
      node.dataset.eventId = event.id;
      if (Number(event.id) === selectedId) node.classList.add("is-selected");

      node.querySelector(".event-type").textContent = event.event_type || event.type_group || "Sự kiện";

      const mapped = Number.isFinite(event.longitude) && Number.isFinite(event.latitude);
      const mapStatus = node.querySelector(".map-status");
      mapStatus.textContent = mapped ? "● Có trên bản đồ" : "○ Chưa có tọa độ";
      mapStatus.title = mapped
        ? "Địa điểm đã có tọa độ"
        : "Sự kiện vẫn có trong danh sách, nhưng chưa đặt marker để tránh sai vị trí.";

      node.querySelector(".event-name").textContent = event.name || "Không tên";
      node.querySelector(".event-time").textContent = `🗓 ${event.schedule_raw || "Chưa cập nhật thời gian"}`;
      node.querySelector(".event-venue").textContent = `📍 ${event.venue || "Chưa cập nhật địa điểm"}`;

      const noteEl = node.querySelector(".event-note");
      if (event.note) {
        noteEl.textContent = event.note;
      } else {
        noteEl.remove();
      }

      const eventUrl = validHttpUrl(event.url);
      const eventLink = node.querySelector(".event-link");
      if (eventUrl) eventLink.href = eventUrl;
      else eventLink.hidden = true;

      const mapsUrl = validHttpUrl(event.maps_url);
      const mapsLink = node.querySelector(".maps-link");
      if (mapsUrl) mapsLink.href = mapsUrl;
      else mapsLink.hidden = true;

      node.addEventListener("click", (ev) => {
        if (ev.target.closest("a")) return;
        selectEvent(event, false);
      });

      fragment.append(node);
    }

    els.list.append(fragment);
  }

  function renderMap(events) {
    if (!mapReady || !map) return;
    map.setEvents(events);
  }

  function renderStatus(events) {
    els.count.textContent = `${events.length} sự kiện`;

    const bits = [];
    if (els.date.value) {
      const d = safeDate(els.date.value);
      bits.push(d ? dateFmt.format(d) : els.date.value);
    } else if (els.hidePast.checked) {
      bits.push("đang diễn ra / sắp tới");
    } else {
      bits.push("toàn bộ dữ liệu");
    }
    if (els.type.value) bits.push(els.type.value);
    if (els.search.value.trim()) bits.push(`“${els.search.value.trim()}”`);

    els.summary.textContent = bits.join(" · ");
  }

  function selectEvent(event, fromMap) {
    selectedId = Number(event.id);

    document.querySelectorAll(".event-card").forEach(card => {
      card.classList.toggle("is-selected", Number(card.dataset.eventId) === selectedId);
    });

    const card = document.querySelector(`.event-card[data-event-id="${CSS.escape(String(event.id))}"]`);
    if (fromMap && card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });

    if (Number.isFinite(event.longitude) && Number.isFinite(event.latitude) && mapReady && map) {
      map.focusEvent(event);
      if (window.innerWidth <= 720 && !fromMap) setMobileView("map");
    }
  }

  function syncQueryParams() {
    const q = els.search.value.trim();
    const date = els.date.value;
    const type = els.type.value;

    const next = new URLSearchParams();
    if (date) next.set("date", date);
    if (type) next.set("type", type);
    if (q) next.set("q", q);

    const query = next.toString();
    const url = `${window.location.pathname}${query ? "?" + query : ""}${window.location.hash}`;
    history.replaceState(null, "", url);
  }

  function setMobileView(view) {
    document.body.dataset.mobileView = view;
    document.querySelectorAll(".view-button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === view);
    });
    if (view === "map" && map) setTimeout(() => map.resize(), 60);
  }

  let searchTimer = null;
  els.search.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 120);
  });
  els.date.addEventListener("change", render);
  els.type.addEventListener("change", render);
  els.hidePast.addEventListener("change", render);

  els.today.addEventListener("click", () => {
    els.date.value = localISODate();
    els.hidePast.checked = false;
    render();
  });

  els.clear.addEventListener("click", () => {
    els.search.value = "";
    els.date.value = "";
    els.type.value = "";
    els.hidePast.checked = true;
    render();
  });

  document.querySelectorAll(".view-button").forEach(btn => {
    btn.addEventListener("click", () => setMobileView(btn.dataset.view));
  });

  render();
  initMap();
})();

</script>
</body>
</html>
